name: Forex Signal Engine CI

on:
  push:
    branches:
      - master
      - phase-3-professional-signal-dashboard
      - pre-phase-4-real-market-data
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MT5 bridge syntax
        run: python3 -m py_compile scripts/mt5/bridge.py

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
